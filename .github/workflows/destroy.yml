name: DESTROY Infrastructure (Manual)

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY to confirm infrastructure deletion"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Explicit human confirmation gate
    - name: Validate confirmation
      run: |
        if [ "${{ github.event.inputs.confirm_destroy }}" != "DESTROY" ]; then
          echo "Confirmation failed. Type DESTROY exactly."
          exit 1
        fi

    # 2️⃣ Checkout repo
    - name: Checkout code
      uses: actions/checkout@v4

    # 3️⃣ Configure AWS credentials (OIDC)
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ secrets.AWS_REGION }}

    # 4️⃣ Install Terraform (MISSING BEFORE)
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.6

    # 5️⃣ Terraform Init + Destroy
    - name: Terraform Destroy
      working-directory: terraform
      run: |
        terraform init
        terraform destroy -auto-approve