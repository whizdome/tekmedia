name: Build Push Deploy

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout repository
    - name: Checkout code
      uses: actions/checkout@v4

    # 2️⃣ Configure AWS credentials (OIDC)
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ secrets.AWS_REGION }}

    # 3️⃣ Install Terraform
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.6

    # 4️⃣ Terraform Init
    - name: Terraform Init
      working-directory: terraform
      run: terraform init

    # 5️⃣ Import EKS Access Entry (idempotent - fails silently if not needed)
    - name: Import EKS Access Entry
      working-directory: terraform
      continue-on-error: true
      run: |
        terraform import \
          -var="github_actions_role_arn=${{ secrets.AWS_ROLE_ARN }}" \
          'module.eks.aws_eks_access_entry.this["github_actions"]' \
          "${{ secrets.EKS_CLUSTER_NAME }}:${{ secrets.AWS_ROLE_ARN }}"

    # 6️⃣ Terraform Apply
    - name: Terraform Apply
      working-directory: terraform
      timeout-minutes: 30
      run: |
        terraform apply -auto-approve \
          -var="github_actions_role_arn=${{ secrets.AWS_ROLE_ARN }}"

    # 7️⃣ Login to Amazon ECR
    - name: Login to ECR
      run: |
        aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
          | docker login \
          --username AWS \
          --password-stdin \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

    # 8️⃣ Build & Push Docker Image
    - name: Build and Push Image
      run: |
        docker build -t my-app:${{ github.sha }} .
        docker tag my-app:${{ github.sha }} \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPO }}:${{ github.sha }}
        docker push \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPO }}:${{ github.sha }}

    # 9️⃣ Install kubectl
    - name: Install kubectl
      run: |
        curl -LO https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/

    # 🔟 Update kubeconfig for EKS
    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig \
          --name ${{ secrets.EKS_CLUSTER_NAME }} \
          --region ${{ secrets.AWS_REGION }}

    # 1️⃣1️⃣ Deploy to EKS
    - name: Deploy to EKS
      run: |
        sed -i "s|IMAGE_PLACEHOLDER|${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPO }}:${{ github.sha }}|g" k8s/deployment.yaml
        kubectl apply -f k8s/deployment.yaml